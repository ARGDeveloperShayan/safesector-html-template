<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="SafeSector | Professional HDD & SSD Data Recovery Services">
    <meta name="description" content="Specialized hard drive repair & data recovery. From click of death to firmware corruption — we bring drives back to life. Free diagnosis, 99% success rate, 24/7 emergency service.">
    <meta name="keywords" content="HDD recovery, data recovery, hard drive repair, click of death, PCB swap, firmware recovery, SSD recovery, cleanroom data recovery, PC3000">
    <meta name="author" content="ThemeStudio">
    <title>SafeSector · Page not found</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="assets/imgs/logo.png" rel="icon" type="image/png">
</head>
<body id="top" data-page="404">
    <div class="error-page-wrapper">
        <!-- Decorative circles -->
        <div class="error-bg-circle error-bg-circle-1"></div>
        <div class="error-bg-circle error-bg-circle-2"></div>
        <div class="error-bg-circle error-bg-circle-3"></div>

        <main class="error-main">
            <div class="error-container">
                <!-- Animated icon -->
                <div class="error-icon">
                    <svg class="icon" aria-hidden="true"><use href="assets/sprites/sprites.svg#icon-hdd"></use></svg>
                </div>

                <!-- 404 code -->
                <div class="error-code">404</div>

                <!-- Subtitle -->
                <p class="error-subtitle" data-i18n-html="err.sub">Sector <span>Not Found</span></p>

                <!-- Description -->
                <p class="error-description" data-i18n="err.desc">The page you're looking for has been deleted, moved, or never existed. Like a corrupted sector, it's unrecoverable — but we can help you find your way back.</p>

                <!-- Action buttons -->
                <div class="error-actions">
                    <a href="index.html" class="btn btn-primary">
                        <svg class="icon" aria-hidden="true"><use href="assets/sprites/sprites.svg#icon-home"></use></svg>
                        <span data-i18n="err.home">Back to Home</span>
                    </a>
                    <a href="index.html#contact" class="btn btn-outline">
                        <svg class="icon" aria-hidden="true"><use href="assets/sprites/sprites.svg#icon-envelope"></use></svg>
                        <span data-i18n="err.contact">Contact Us</span>
                    </a>
                </div>

                <!-- Search bar -->
                <form class="error-search" action="search.html" method="get">
                    <input type="text" class="error-search-input" placeholder="Search for something else..." aria-label="Search website" data-i18n-ph="err.ph">
                    <button type="submit" class="error-search-btn">
                        <svg class="icon" aria-hidden="true"><use href="assets/sprites/sprites.svg#icon-search"></use></svg>
                        <span data-i18n="err.btn">Search</span>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="assets/js/lang.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
